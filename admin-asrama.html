<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Asrama - Laporan Santri</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}.top{background:#1f2937;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto}.top h1{margin:0 0 5px;font-size:24px}.top p{margin:0;color:#d1d5db;font-size:14px}.content{max-width:1100px;margin:24px auto;padding:0 16px}.welcome,.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #0000000b}.welcome h2{margin:0 0 6px}.welcome p{margin:0;color:#6b7280}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card h3{margin:0 0 8px}.card p{color:#6b7280;font-size:14px;line-height:1.5}.btn{display:inline-block;margin-top:10px;padding:11px 14px;border:0;border-radius:9px;background:#1f2937;color:#fff;cursor:pointer;text-decoration:none}.danger{background:#b91c1c}.status{padding:12px;background:#f3f4f6;border-radius:10px;font-size:14px;margin-top:16px}.hidden{display:none}@media(max-width:600px){.top h1{font-size:20px}.content{margin-top:16px}.card{padding:17px}}</style></head><body><header class="top"><div class="wrap"><h1>Laporan Santri</h1><p>Dashboard Admin Asrama</p></div></header><main class="content"><section class="welcome"><h2 id="nama">Memuat...</h2><p id="sub">Memeriksa akun dan hak akses...</p><div id="status" class="status">Menghubungkan ke sistem...</div></section><div id="dashboard" class="grid hidden"><article class="card"><h3>📝 Catatan Asrama</h3><p>Catat perkembangan kehidupan asrama dan catatan santri yang ditangani Admin Asrama.</p><button class="btn" onclick="alert('Modul Catatan Asrama kita buat setelah alur laporan inti selesai.')">Buka Catatan Asrama</button></article></div><button id="logout" class="btn danger hidden">Keluar</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const {data:u,error}=await db.from('users').select('nama,username,role,aktif').eq('id',session.user.id).single();if(error||!u||!u.aktif||u.role!=='admin_asrama'){await db.auth.signOut();location.href='index.html';return}document.getElementById('nama').textContent='Halo, '+(u.nama||'Admin Asrama');document.getElementById('sub').textContent='Anda masuk sebagai Admin Asrama.';document.getElementById('status').textContent='Akses Asrama aktif.';document.getElementById('dashboard').classList.remove('hidden');document.getElementById('logout').classList.remove('hidden')})();document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='index.html'};</script></body></html>
