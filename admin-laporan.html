<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoring Laporan - Laporan Santri</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h2{margin:0}.back,.logout{border:1px solid #dfe4ea;background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none;color:#18212f}.filters,.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:17px;margin-bottom:15px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters select,.filters input{padding:10px;border:1px solid #dfe4ea;border-radius:9px;background:#fff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.stat{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:15px}.stat b{display:block;font-size:23px;margin-top:5px}.muted{color:#718096;font-size:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf0f4;font-size:14px}.table th{font-size:12px;color:#718096}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f7;font-size:12px}.empty{padding:25px;text-align:center;color:#718096}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-wrap:wrap}}</style></head><body><main class="wrap"><div class="top"><h2>📋 Monitoring Laporan</h2><div><a class="back" href="admin.html">← Admin Utama</a> <button class="logout" id="logout">Keluar</button></div></div><div class="filters"><select id="period"><option value="">Semua Periode</option></select><select id="status"><option value="">Semua Status</option><option value="draft">Draft</option><option value="dikirim">Dikirim</option><option value="perlu_perbaikan">Perlu Perbaikan</option><option value="terbit">Terbit</option></select><input id="search" placeholder="Cari nama santri..."></div><div class="summary"><div class="stat"><span class="muted">Total</span><b id="nTotal">0</b></div><div class="stat"><span class="muted">Draft</span><b id="nDraft">0</b></div><div class="stat"><span class="muted">Perlu Perbaikan</span><b id="nFix">0</b></div><div class="stat"><span class="muted">Terbit</span><b id="nPublished">0</b></div></div><section class="card"><div class="muted" style="margin-bottom:12px">Daftar laporan perkembangan santri</div><div class="tablewrap"><table class="table"><thead><tr><th>Santri</th><th>NIS</th><th>Periode</th><th>Kelas</th><th>Asrama</th><th>Status</th><th>Diterbitkan</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Memuat...</td></tr></tbody></table></div></section></main><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const months=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];let all=[];function labelStatus(s){return({draft:'Draft',dikirim:'Dikirim',perlu_perbaikan:'Perlu Perbaikan',terbit:'Terbit'})[s]||s}function render(){const p=period.value,s=status.value,q=search.value.trim().toLowerCase();let data=all.filter(x=>(!p||x.periode_id===p)&&(!s||x.status===s)&&(!q||x.nama_lengkap.toLowerCase().includes(q)||(x.nis||'').toLowerCase().includes(q)));nTotal.textContent=data.length;nDraft.textContent=data.filter(x=>x.status==='draft').length;nFix.textContent=data.filter(x=>x.status==='perlu_perbaikan').length;nPublished.textContent=data.filter(x=>x.status==='terbit').length;rows.innerHTML=data.length?data.map(x=>'<tr><td><b>'+esc(x.nama_lengkap)+'</b></td><td>'+esc(x.nis)+'</td><td>'+months[x.bulan]+' '+x.tahun+' · Smt '+x.semester+'</td><td>'+esc(x.kelas_snapshot)+'</td><td>'+esc(x.asrama_snapshot)+'</td><td><span class="badge">'+esc(labelStatus(x.status))+'</span></td><td>'+esc(x.diterbitkan_pada?new Date(x.diterbitkan_pada).toLocaleDateString('id-ID'):'-')+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">Tidak ada laporan yang sesuai.</td></tr>'}async function run(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const{data:u,error:ue}=await db.from('users').select('nama,role,aktif').eq('id',session.user.id).single();if(ue||!u||u.role!=='admin'||!u.aktif){location.href='index.html';return}const{data:p,error:pe}=await db.from('periode_laporan').select('id,bulan,tahun,semester').order('tahun',{ascending:false}).order('bulan',{ascending:false});if(pe){rows.innerHTML='<tr><td colspan="7" class="empty">Gagal memuat periode.</td></tr>';return}(p||[]).forEach(x=>period.insertAdjacentHTML('beforeend','<option value="'+x.id+'">'+months[x.bulan]+' '+x.tahun+' · Smt '+x.semester+'</option>'));const{data,error}=await db.from('laporan_bulanan').select('id,santri_id,periode_id,kelas_snapshot,asrama_snapshot,status,diterbitkan_pada,santri(nama_lengkap,nis),periode_laporan(bulan,tahun,semester)').order('created_at',{ascending:false});if(error){rows.innerHTML='<tr><td colspan="7" class="empty">Gagal memuat laporan: '+esc(error.message)+'</td></tr>';return}all=(data||[]).map(x=>({id:x.id,santri_id:x.santri_id,periode_id:x.periode_id,kelas_snapshot:x.kelas_snapshot,asrama_snapshot:x.asrama_snapshot,status:x.status,diterbitkan_pada:x.diterbitkan_pada,nama_lengkap:x.santri?.nama_lengkap||'-',nis:x.santri?.nis||'-',bulan:x.periode_laporan?.bulan||0,tahun:x.periode_laporan?.tahun||0,semester:x.periode_laporan?.semester||0}));render()}period.onchange=render;status.onchange=render;search.oninput=render;logout.onclick=async()=>{await db.auth.signOut();location.href='index.html'};run();</script></body></html>
