<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log - Laporan Santri</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:1200px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h2{margin:0}.btn{border:1px solid #dfe4ea;background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none;color:#18212f}.toolbar,.tablebox{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:16px;margin-bottom:15px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid #dfe4ea;border-radius:10px;padding:10px;background:#fff}.toolbar input{flex:1;min-width:220px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f4;vertical-align:top}th{font-size:12px;color:#64748b;background:#fafbfc;white-space:nowrap}.muted{color:#718096;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f7;font-size:11px;font-weight:600}.detail{max-width:360px;white-space:pre-wrap;word-break:break-word;color:#526071}.empty{padding:25px;text-align:center;color:#718096}.count{margin:0 0 12px}.error{color:#b42318;background:#fff1f0;border:1px solid #ffd5d2;padding:10px;border-radius:10px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}th:nth-child(5),td:nth-child(5){display:none}}</style></head><body><main class="wrap"><div class="top"><h2>📝 Audit Log</h2><a class="btn" href="admin.html">← Kembali</a></div><div id="msg"></div><section class="toolbar"><input id="q" placeholder="Cari pengguna, aksi, tabel, atau record..."/><select id="aksi"><option value="">Semua aksi</option><option value="INSERT">INSERT</option><option value="UPDATE">UPDATE</option><option value="DELETE">DELETE</option></select><select id="tabel"><option value="">Semua modul</option><option value="laporan_bulanan">Laporan Bulanan</option><option value="laporan_akademik">Akademik</option><option value="laporan_tahfizh">Tahfizh</option><option value="laporan_kepengasuhan">Kepengasuhan</option><option value="ringkasan_perkembangan">Ringkasan Perkembangan</option><option value="catatan_santri">Catatan Santri</option><option value="prestasi">Prestasi</option><option value="pembinaan">Pembinaan</option><option value="penugasan">Penugasan</option></select><button class="btn" id="refresh">Muat Ulang</button></section><section class="tablebox"><p class="count" id="count">Memuat...</p><div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Modul</th><th>Record</th><th>Perubahan</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let logs=[];let names={};const label=t=>({laporan_bulanan:'Laporan Bulanan',laporan_akademik:'Akademik',laporan_tahfizh:'Tahfizh',laporan_kepengasuhan:'Kepengasuhan',ringkasan_perkembangan:'Ringkasan Perkembangan',catatan_santri:'Catatan Santri',prestasi:'Prestasi',pembinaan:'Pembinaan',penugasan:'Penugasan'})[t]||t;function render(){const query=q.value.toLowerCase().trim(),act=aksi.value,tab=tabel.value;const data=logs.filter(x=>(!act||x.aksi===act)&&(!tab||x.tabel===tab)&&(!query||[x.aksi,x.tabel,x.record_id,names[x.user_id],JSON.stringify(x.data_lama),JSON.stringify(x.data_baru)].join(' ').toLowerCase().includes(query)));count.textContent=data.length+' aktivitas ditampilkan';rows.innerHTML=data.length?data.map(x=>{const old=x.data_lama?JSON.stringify(x.data_lama,null,2):'',nw=x.data_baru?JSON.stringify(x.data_baru,null,2):'';let change='';if(x.aksi==='INSERT')change='Data baru dibuat';else if(x.aksi==='DELETE')change='Data dihapus';else change='Data diperbarui';return '<tr><td>'+esc(new Date(x.created_at).toLocaleString('id-ID'))+'</td><td>'+esc(names[x.user_id]||x.user_id||'Sistem')+'</td><td><span class="badge">'+esc(x.aksi)+'</span></td><td>'+esc(label(x.tabel))+'</td><td><small>'+esc(x.record_id)+'</small></td><td><b>'+change+'</b><details><summary>Lihat data</summary><div class="detail">'+(old?'<b>Lama</b>\n'+esc(old)+'\n':'')+(nw?'<b>Baru</b>\n'+esc(nw):'')+'</div></details></td></tr>'}).join(''):'<tr><td colspan="6" class="empty">Belum ada aktivitas yang cocok.</td></tr>'}async function load(){msg.innerHTML='';rows.innerHTML='<tr><td colspan="6" class="empty">Memuat...</td></tr>';const{data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const{data:u,error:ue}=await db.from('users').select('nama,role,aktif').eq('id',session.user.id).single();if(ue||!u||u.role!=='admin'||!u.aktif){location.href='index.html';return}const{data,error}=await db.from('audit_log').select('*').order('created_at',{ascending:false}).limit(500);if(error){msg.innerHTML='<div class="error">Gagal memuat Audit Log: '+esc(error.message)+'</div>';count.textContent='';return}logs=data||[];const ids=[...new Set(logs.map(x=>x.user_id).filter(Boolean))];names={};if(ids.length){const r=await db.from('users').select('id,nama,username').in('id',ids);(r.data||[]).forEach(x=>names[x.id]=x.nama||x.username||x.id)}render()}q.oninput=render;aksi.onchange=render;tabel.onchange=render;refresh.onclick=load;load();</script></body></html>
