<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;max-width:900px;margin:25px auto;padding:0 15px}input,button{padding:9px;width:100%;box-sizing:border-box;margin:5px 0}.item{border:1px solid #ddd;padding:12px;margin:8px 0}</style></head><body><a href="admin.html">← Admin Utama</a><h1>Data Kelas</h1><input id="nama" placeholder="Nama kelas, contoh Kelas 1 KMI"><input id="tingkat" type="number" placeholder="Tingkat (1-6)"><input id="program" placeholder="Program, contoh KMI"><button id="simpan">Tambah Kelas</button><div id="msg"></div><h2>Daftar Kelas</h2><div id="list">Memuat...</div><script>const sb=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return false}const{data:u}=await sb.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||u.role!=='admin'){location.href='index.html';return false}return true}async function load(){const{data,error}=await sb.from('kelas').select('*').order('tingkat').order('nama_kelas');if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.nama_kelas}</b><br>Tingkat: ${x.tingkat||'-'} · Program: ${x.program||'-'}<br>${x.aktif===false?'Nonaktif':'Aktif'}</div>`).join('')||'Belum ada kelas.'}simpan.onclick=async()=>{const n=nama.value.trim();if(!n){msg.textContent='Nama kelas wajib diisi.';return}const{error}=await sb.from('kelas').insert({nama_kelas:n,tingkat:tingkat.value?Number(tingkat.value):null,program:program.value.trim()||null});msg.textContent=error?'Gagal: '+error.message:'Kelas berhasil ditambahkan.';if(!error){nama.value='';tingkat.value='';program.value='';load()}};(async()=>{if(await guard())load()})();</script></body></html>
