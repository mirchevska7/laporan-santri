<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil - Laporan Santri</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}a{color:#18212f;text-decoration:none}.card{background:white;border:1px solid #e5e9ef;border-radius:14px;padding:18px;margin:12px 0}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef0f3}.row:last-child{border-bottom:0}.label{color:#718096}.back{padding:9px 12px;border:1px solid #dfe4ea;border-radius:9px;background:white}</style></head><body><main class="wrap"><div class="top"><h2>👤 Profil</h2><a class="back" href="wali.html">← Kembali</a></div><div id="content">Memuat...</div></main><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const {data:u,error}=await db.from('users').select('nama,username,email,role,aktif').eq('id',session.user.id).single();if(error||!u||u.role!=='wali_santri'||!u.aktif){location.href='index.html';return}const {data:links}=await db.from('santri_wali').select('santri_id,hubungan,utama').eq('user_id',session.user.id).eq('aktif',true);const ids=(links||[]).map(x=>x.santri_id);const {data:santri}=ids.length?await db.from('santri').select('nama_lengkap,nis,status').in('id',ids):{data:[]};document.getElementById('content').innerHTML=`<section class="card"><h3>Data Akun</h3><div class="row"><span class="label">Nama</span><strong>${esc(u.nama)}</strong></div><div class="row"><span class="label">Username</span><strong>${esc(u.username)}</strong></div><div class="row"><span class="label">Email</span><strong>${esc(u.email)}</strong></div><div class="row"><span class="label">Peran</span><strong>Wali Santri</strong></div></section><section class="card"><h3>Santri Terhubung</h3>${(santri||[]).length?(santri||[]).map((s,i)=>`<div class="row"><span>${esc(s.nama_lengkap)}<br><span class="label">NIS ${esc(s.nis)}</span></span><strong>${esc(links[i]?.hubungan||'Wali')}</strong></div>`).join(''):'Belum ada santri terhubung.'}</section>`}run();</script></body></html>
