<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Akademik</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}.top{background:#1f2937;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto}.content{max-width:900px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #0000000b}h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin-top:0}label{display:block;font-weight:600;font-size:14px;margin:15px 0 7px}select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:#fff}textarea{min-height:95px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:12px 16px;border:0;border-radius:9px;background:#1f2937;color:white;font-weight:600;cursor:pointer}.btn.secondary{background:#6b7280}.actions{display:flex;gap:10px;flex-wrap:wrap}.msg{padding:11px;border-radius:9px;margin-bottom:15px;display:none}.ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#b91c1c}.muted{color:#6b7280;font-size:14px}@media(max-width:600px){.row{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><header class="top"><div class="wrap"><h1>Laporan Akademik</h1><div style="color:#d1d5db;font-size:14px">Admin Akademik</div></div></header><main class="content"><div id="msg" class="msg"></div><section class="card"><h2>Pilih Santri & Periode</h2><div class="row"><div><label>Santri</label><select id="santri"><option value="">Memuat santri...</option></select></div><div><label>Periode</label><select id="periode"><option value="">Memuat periode...</option></select></div></div><p id="info" class="muted"></p></section><section class="card"><h2>Perkembangan Akademik</h2><label>Kehadiran</label><select id="kehadiran"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Keaktifan belajar</label><select id="keaktifan"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Kedisiplinan belajar</label><select id="kedisiplinan"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Tanggung jawab tugas</label><select id="tanggung_jawab"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Sikap dalam pembelajaran</label><select id="sikap"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Perkembangan belajar</label><textarea id="perkembangan" placeholder="Tuliskan perkembangan belajar santri..."></textarea><label>Catatan</label><textarea id="catatan" placeholder="Catatan tambahan dari Admin Akademik..."></textarea><div class="actions"><button class="btn" id="save">Simpan Draft</button><button class="btn secondary" id="back">Kembali</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');
const $=id=>document.getElementById(id), msg=$('msg'); let sessionUser=null, report=null;
function message(t,ok=false){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}
const month=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}sessionUser=session.user;const {data:u,error:ue}=await db.from('users').select('nama,role,aktif').eq('id',session.user.id).single();if(ue||!u||!u.aktif||u.role!=='admin_akademik'){await db.auth.signOut();location.href='index.html';return}
const {data:s,error:se}=await db.from('santri').select('id,nis,nama_lengkap').eq('status','aktif').order('nama_lengkap');if(se){message('Gagal memuat data santri: '+se.message);return} $('santri').innerHTML='<option value="">Pilih santri</option>'+s.map(x=>`<option value="${x.id}">${x.nama_lengkap} — ${x.nis}</option>`).join('');
const {data:p,error:pe}=await db.from('periode_laporan').select('id,bulan,tahun,semester,status').order('tahun',{ascending:false}).order('bulan',{ascending:false});if(pe){message('Gagal memuat periode: '+pe.message);return}$('periode').innerHTML='<option value="">Pilih periode</option>'+p.map(x=>`<option value="${x.id}">${month[x.bulan-1]} ${x.tahun} — Semester ${x.semester}</option>`).join('');
$('santri').onchange=loadReport;$('periode').onchange=loadReport;$('save').onclick=saveReport;$('back').onclick=()=>location.href='admin-akademik.html';}
async function loadReport(){report=null;const sid=$('santri').value,pid=$('periode').value;if(!sid||!pid)return;const {data:lb,error}=await db.from('laporan_bulanan').select('*').eq('santri_id',sid).eq('periode_id',pid).maybeSingle();if(error){message('Gagal memuat laporan: '+error.message);return}if(lb){report=lb;const {data:a}=await db.from('laporan_akademik').select('*').eq('laporan_id',lb.id).maybeSingle();if(a){['kehadiran','keaktifan','kedisiplinan','tanggung_jawab','sikap','perkembangan','catatan'].forEach(k=>$(k).value=a[k]||'');$('info').textContent='Laporan akademik sudah ada. Status: '+(a.status||'draft')+'.'}else $('info').textContent='Laporan utama sudah ada, data akademik belum diisi.';}else $('info').textContent='Belum ada laporan untuk santri dan periode ini. Sistem akan membuat laporan baru saat disimpan.'}
async function saveReport(){msg.style.display='none';const sid=$('santri').value,pid=$('periode').value;if(!sid||!pid){message('Pilih santri dan periode terlebih dahulu.');return}const btn=$('save');btn.disabled=true;btn.textContent='Menyimpan...';try{if(!report){const {data:sk}=await db.from('santri_kelas').select('kelas_id,kelas(nama)').eq('santri_id',sid).eq('aktif',true).maybeSingle();const {data:sa}=await db.from('santri_asrama').select('asrama_id,asrama(nama)').eq('santri_id',sid).eq('aktif',true).maybeSingle();const payload={santri_id:sid,periode_id:pid,kelas_snapshot:sk?.kelas?.nama||null,asrama_snapshot:sa?.asrama?.nama||null,status:'draft'};const r=await db.from('laporan_bulanan').insert(payload).select().single();if(r.error)throw r.error;report=r.data}
const data={laporan_id:report.id,kehadiran:$('kehadiran').value||null,keaktifan:$('keaktifan').value||null,kedisiplinan:$('kedisiplinan').value||null,tanggung_jawab:$('tanggung_jawab').value||null,sikap:$('sikap').value||null,perkembangan:$('perkembangan').value.trim()||null,catatan:$('catatan').value.trim()||null,diisi_oleh:sessionUser.id,status:'draft'};const existing=await db.from('laporan_akademik').select('id').eq('laporan_id',report.id).maybeSingle();let r;if(existing.data)r=await db.from('laporan_akademik').update(data).eq('id',existing.data.id);else r=await db.from('laporan_akademik').insert(data);if(r.error)throw r.error;message('Laporan akademik berhasil disimpan sebagai Draft.',true);$('info').textContent='Draft tersimpan. Laporan belum diterbitkan dan belum terlihat oleh wali.'}catch(e){console.error(e);message('Gagal menyimpan: '+e.message)}finally{btn.disabled=false;btn.textContent='Simpan Draft'}}init();
</script></body></html>
