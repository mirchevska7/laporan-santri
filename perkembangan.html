<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Perkembangan - Laporan Santri</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:1050px;margin:auto;padding:25px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:8px}h2{margin:0;font-size:27px}.back{padding:10px 14px;border:1px solid #dfe4ea;border-radius:10px;background:#fff;color:#18212f;text-decoration:none;white-space:nowrap}.subtitle{color:#718096;margin:7px 0 22px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 3px 12px rgba(20,35,55,.04)}.student{font-weight:700;font-size:17px}.student span{display:block;color:#718096;font-weight:400;font-size:13px;margin-top:4px}.section-title{font-size:18px;margin:0 0 13px}.table-wrap{overflow-x:auto}.trend{width:100%;border-collapse:collapse;min-width:720px}.trend th,.trend td{padding:12px 10px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}.trend th{font-size:12px;color:#718096;background:#fafbfc}.trend td:first-child{font-weight:600;min-width:160px}.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#f0f2f5;font-size:12px;font-weight:600;white-space:nowrap}.empty{text-align:center;color:#718096;padding:24px}.error{color:#b42318;background:#fff0f0}.note{font-size:12px;color:#7a8697;margin-top:12px;line-height:1.5}.month-card{display:none}.month-card h3{margin:0 0 14px;font-size:16px}.item{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #eef0f3}.item:last-child{border-bottom:0}.item span{color:#718096;font-size:13px}.item strong{font-size:13px;text-align:right}.footer{text-align:center;color:#8993a3;font-size:12px;margin-top:28px}@media(max-width:650px){.wrap{padding:20px 14px 40px}h2{font-size:23px}.card{padding:17px}.table-wrap{display:none}.month-card{display:block}.item{align-items:flex-start}.item strong{max-width:52%}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h2>📈 Riwayat Perkembangan</h2><a class="back" href="wali.html">← Kembali</a></div>
<p class="subtitle">Melihat arah perkembangan santri dari laporan bulanan yang sudah diterbitkan.</p>
<div id="student" class="card empty">Memuat data santri...</div>
<div id="content"><div class="card empty">Memuat riwayat perkembangan...</div></div>
<div class="footer">Laporan Santri • Riwayat Perkembangan</div>
</main>
<script>
const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');
const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bulan=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function val(v){return v?'<span class="badge">'+esc(v)+'</span>':'<span class="badge">—</span>'}
function mobileItem(label,v){return '<div class="item"><span>'+esc(label)+'</span><strong>'+ (v?esc(v):'—')+'</strong></div>'}
async function run(){
 const {data:{session}}=await db.auth.getSession(); if(!session){location.href='index.html';return}
 const {data:user,error:ue}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();
 if(ue||!user||user.role!=='wali_santri'||!user.aktif){location.href='index.html';return}
 const santriId=new URLSearchParams(location.search).get('santri_id'); if(!santriId){location.href='wali.html';return}
 const {data:link}=await db.from('santri_wali').select('hubungan').eq('user_id',session.user.id).eq('santri_id',santriId).eq('aktif',true).maybeSingle();
 if(!link){document.getElementById('content').innerHTML='<div class="card empty error">Anda tidak memiliki akses ke santri ini.</div>';return}
 const [{data:s,error:se},{data:rows,error:re}]=await Promise.all([
   db.from('santri').select('nama_lengkap,nis,nama_panggilan').eq('id',santriId).single(),
   db.rpc('get_wali_perkembangan',{p_santri_id:santriId})
 ]);
 if(se||!s){document.getElementById('student').className='card empty error';document.getElementById('student').textContent='Data santri belum dapat dimuat.';return}
 document.getElementById('student').innerHTML='<div class="student">'+esc(s.nama_lengkap||s.nama_panggilan)+'<span>NIS '+esc(s.nis||'-')+'</span></div>';
 if(re){document.getElementById('content').innerHTML='<div class="card empty error">Riwayat perkembangan belum dapat dimuat.</div>';return}
 if(!rows?.length){document.getElementById('content').innerHTML='<div class="card empty">Belum ada laporan bulanan yang diterbitkan untuk santri ini.</div>';return}
 let html='<section class="card"><h3 class="section-title">Perbandingan Perkembangan</h3><div class="table-wrap"><table class="trend"><thead><tr><th>Aspek</th>';
 rows.forEach(r=>html+='<th>'+bulan[r.bulan]+' '+r.tahun+'</th>');
 html+='</tr></thead><tbody>';
 const aspects=[['Kehadiran','akademik_kehadiran'],['Keaktifan Belajar','akademik_keaktifan'],['Kedisiplinan Belajar','akademik_kedisiplinan'],['Murajaah','tahfizh_murajaah'],['Kelancaran Tahfizh','tahfizh_kelancaran'],['Mutqin','tahfizh_mutqin'],['Konsistensi Setoran','tahfizh_konsistensi'],['Kedisiplinan','pengasuhan_kedisiplinan'],['Adab & Akhlak','pengasuhan_adab'],['Kemandirian','pengasuhan_kemandirian'],['Kepatuhan Aturan','pengasuhan_kepatuhan'],['Kegiatan Pondok','pengasuhan_kegiatan']];
 aspects.forEach(a=>{html+='<tr><td>'+esc(a[0])+'</td>';rows.forEach(r=>html+='<td>'+val(r[a[1]])+'</td>');html+='</tr>'});
 html+='</tbody></table></div><div class="note">Hanya laporan berstatus <b>Terbit</b> yang ditampilkan. Tanda “—” berarti aspek tersebut belum diisi pada laporan bulan tersebut.</div></section>';
 rows.forEach(r=>{html+='<section class="card month-card"><h3>'+bulan[r.bulan]+' '+r.tahun+'</h3>'+mobileItem('Kehadiran',r.akademik_kehadiran)+mobileItem('Keaktifan Belajar',r.akademik_keaktifan)+mobileItem('Kedisiplinan Belajar',r.akademik_kedisiplinan)+mobileItem('Murajaah',r.tahfizh_murajaah)+mobileItem('Kelancaran Tahfizh',r.tahfizh_kelancaran)+mobileItem('Mutqin',r.tahfizh_mutqin)+mobileItem('Konsistensi Setoran',r.tahfizh_konsistensi)+mobileItem('Kedisiplinan',r.pengasuhan_kedisiplinan)+mobileItem('Adab & Akhlak',r.pengasuhan_adab)+mobileItem('Kemandirian',r.pengasuhan_kemandirian)+mobileItem('Kepatuhan Aturan',r.pengasuhan_kepatuhan)+mobileItem('Kegiatan Pondok',r.pengasuhan_kegiatan)+'</section>'});
 document.getElementById('content').innerHTML=html;
}
run();
</script>
</body>
</html>
