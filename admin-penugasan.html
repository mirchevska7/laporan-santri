<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penugasan Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:1000px;margin:auto;padding:24px 16px}a{color:#18212f}.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin:16px 0}label{display:block;font-size:13px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,button{width:100%;padding:10px;box-sizing:border-box;border:1px solid #d7dde5;border-radius:9px;margin:5px 0 10px}button{background:#18212f;color:#fff;cursor:pointer}.item{border:1px solid #e3e8ef;border-radius:10px;padding:12px;margin:8px 0}.muted{color:#718096;font-size:13px}.ok{color:#067647}.err{color:#b42318}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="admin.html">← Admin Utama</a><h1>🔐 Penugasan Admin</h1><div class="card"><h3>Tambah Penugasan</h3><div class="grid"><div><label>Pengguna</label><select id="user"></select></div><div><label>Jenis Penugasan</label><select id="jenis"><option value="kelas">Kelas</option><option value="asrama">Asrama</option><option value="santri">Santri</option></select></div><div id="kelasBox"><label>Kelas</label><select id="kelas"></select></div><div id="asramaBox" style="display:none"><label>Asrama</label><select id="asrama"></select></div><div id="santriBox" style="display:none"><label>Santri</label><select id="santri"></select></div><div><label>Mulai</label><input id="mulai" type="date"></div><div><label>Selesai (opsional)</label><input id="selesai" type="date"></div><div><label>Status</label><select id="aktif"><option value="true">Aktif</option><option value="false">Tidak aktif</option></select></div></div><button id="simpan">Simpan Penugasan</button><div id="msg"></div></div><div class="card"><h3>Penugasan Aktif</h3><div id="list">Memuat...</div></div></main><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const $=id=>document.getElementById(id);const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return false}const{data:u}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||u.role!=='admin'){location.href='index.html';return false}return true}async function load(){const[us,ks,as,ss,ps]=await Promise.all([db.from('users').select('id,nama,username,role').eq('aktif',true).order('nama'),db.from('kelas').select('id,nama_kelas').eq('aktif',true).order('nama_kelas'),db.from('asrama').select('id,nama_asrama').eq('aktif',true).order('nama_asrama'),db.from('santri').select('id,nama_lengkap,nis').eq('status','aktif').order('nama_lengkap'),db.from('penugasan').select('id,user_id,jenis,kelas_id,asrama_id,santri_id,mulai,selesai,aktif,users(nama,username),kelas(nama_kelas),asrama(nama_asrama),santri(nama_lengkap)').eq('aktif',true).order('created_at',{ascending:false})]);if(us.error||ks.error||as.error||ss.error||ps.error){$('list').textContent='Gagal memuat data. '+(ps.error?.message||us.error?.message||'');return}$('user').innerHTML=(us.data||[]).filter(x=>x.role!=='wali_santri').map(x=>`<option value="${x.id}">${esc(x.nama)} — ${esc(x.username||'')} (${esc(x.role)})</option>`).join('');$('kelas').innerHTML=(ks.data||[]).map(x=>`<option value="${x.id}">${esc(x.nama_kelas)}</option>`).join('');$('asrama').innerHTML=(as.data||[]).map(x=>`<option value="${x.id}">${esc(x.nama_asrama)}</option>`).join('');$('santri').innerHTML=(ss.data||[]).map(x=>`<option value="${x.id}">${esc(x.nama_lengkap)} — ${esc(x.nis)}</option>`).join('');$('list').innerHTML=(ps.data||[]).map(x=>`<div class="item"><b>${esc(x.users?.nama||'-')}</b> — ${esc(x.users?.username||'')}<br>Jenis: ${esc(x.jenis)} · ${esc(x.jenis==='kelas'?x.kelas?.nama_kelas:x.jenis==='asrama'?x.asrama?.nama_asrama:x.santri?.nama_lengkap)}<br><span class="muted">Mulai ${esc(x.mulai)}${x.selesai?' · Selesai '+esc(x.selesai):''}</span></div>`).join('')||'<span class="muted">Belum ada penugasan aktif.</span>'}jenis.onchange=()=>{kelasBox.style.display=jenis.value==='kelas'?'block':'none';asramaBox.style.display=jenis.value==='asrama'?'block':'none';santriBox.style.display=jenis.value==='santri'?'block':'none'};simpan.onclick=async()=>{if(!$('user').value||!$('mulai').value){$('msg').textContent='Pengguna dan tanggal mulai wajib diisi.';$('msg').className='err';return}const payload={user_id:user.value,jenis:jenis.value,mulai:mulai.value,selesai:selesai.value||null,aktif:aktif.value==='true',kelas_id:jenis.value==='kelas'?kelas.value:null,asrama_id:jenis.value==='asrama'?asrama.value:null,santri_id:jenis.value==='santri'?santri.value:null};const{error}=await db.from('penugasan').insert(payload);$('msg').textContent=error?'Gagal: '+error.message:'Penugasan berhasil disimpan.';$('msg').className=error?'err':'ok';if(!error)load()};(async()=>{if(await guard())load()})();</script></body></html>
