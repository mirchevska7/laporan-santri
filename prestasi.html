<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prestasi Santri</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}a{color:#18212f;text-decoration:none}.card{background:white;border:1px solid #e5e9ef;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#718096;font-size:13px}.tag{display:inline-block;padding:5px 9px;border-radius:8px;background:#f0f2f5;font-size:12px;margin:3px}.back{padding:9px 12px;border:1px solid #dfe4ea;border-radius:9px;background:white}</style></head><body><main class="wrap"><div class="top"><h2>🏆 Prestasi Santri</h2><a class="back" href="wali.html">← Kembali</a></div><div id="content" class="muted">Memuat...</div></main><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const {data:u}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||u.role!=='wali_santri'||!u.aktif){location.href='index.html';return}const {data:links}=await db.from('santri_wali').select('santri_id').eq('user_id',session.user.id).eq('aktif',true);const ids=(links||[]).map(x=>x.santri_id);if(!ids.length){document.getElementById('content').textContent='Belum ada santri terhubung.';return}const {data:rows,error}=await db.from('prestasi').select('tanggal,nama_prestasi,kategori,tingkat,keterangan,bukti_url').in('santri_id',ids).order('tanggal',{ascending:false});if(error){document.getElementById('content').textContent='Prestasi belum dapat dimuat: '+error.message;return}document.getElementById('content').innerHTML=rows?.length?rows.map(r=>`<article class="card"><h3>${esc(r.nama_prestasi||'-')}</h3><div class="muted">${esc(r.tanggal||'-')}</div><span class="tag">${esc(r.kategori||'lainnya')}</span><span class="tag">${esc(r.tingkat||'-')}</span><p>${esc(r.keterangan||'')}</p>${r.bukti_url?`<a href="${esc(r.bukti_url)}" target="_blank" rel="noopener">Lihat bukti</a>`:''}</article>`).join(''):'Belum ada prestasi yang tercatat.'}run();</script></body></html>
