<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilih Santri - Riwayat Perkembangan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:720px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{padding:10px 14px;border:1px solid #dfe4ea;border-radius:10px;background:#fff;color:#18212f;text-decoration:none}h2{margin:0;font-size:25px}.sub{color:#718096;margin:8px 0 22px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:20px;margin:15px 0}.item{display:block;text-decoration:none;color:inherit;background:#f7f8fa;border:1px solid #e7ebf0;border-radius:12px;padding:15px;margin:9px 0}.item:hover{background:#fff;border-color:#b9c2ce}.item strong{display:block}.item span{display:block;color:#718096;font-size:12px;margin-top:5px}.empty{text-align:center;color:#718096;padding:22px}.error{color:#b42318;background:#fff0f0}</style>
</head><body><main class="wrap"><div class="top"><h2>📈 Riwayat Perkembangan</h2><a class="back" href="wali.html">← Kembali</a></div><p class="sub">Pilih santri yang ingin dilihat perkembangan bulanannya.</p><section class="card" id="box"><div class="empty">Memuat santri...</div></section></main>
<script>
const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');
const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function run(){const box=document.getElementById('box');const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const {data:u}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||u.role!=='wali_santri'||!u.aktif){location.href='index.html';return}const {data:links,error}=await db.from('santri_wali').select('santri_id').eq('user_id',session.user.id).eq('aktif',true);if(error||!links?.length){box.innerHTML='<div class="empty">Belum ada santri yang terhubung.</div>';return}const {data:santri,error:se}=await db.from('santri').select('id,nama_lengkap,nama_panggilan,nis').in('id',links.map(x=>x.santri_id));if(se||!santri?.length){box.innerHTML='<div class="empty error">Data santri belum dapat dimuat.</div>';return}box.innerHTML=santri.map(s=>'<a class="item" href="perkembangan.html?santri_id='+encodeURIComponent(s.id)+'"><strong>'+esc(s.nama_lengkap||s.nama_panggilan)+'</strong><span>NIS '+esc(s.nis||'-')+' • Lihat perkembangan →</span></a>').join('')};run();
</script></body></html>
