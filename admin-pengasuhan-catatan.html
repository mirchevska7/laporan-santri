<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catatan Santri</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px}label{display:block;margin-top:14px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button,.back{margin-top:18px;padding:10px 16px;display:inline-block}.item{border:1px solid #ddd;padding:12px;margin-top:10px}.msg{margin-top:14px;padding:10px;background:#f3f3f3}</style></head><body>
<a class="back" href="admin-pengasuhan.html">← Kembali</a><h1>Catatan Santri</h1><p>Catatan perkembangan, bukan catatan pelanggaran.</p>
<label>Santri</label><select id="santri"></select><label>Tanggal</label><input id="tanggal" type="date"><label>Sumber Catatan</label><select id="sumber"><option value="kepengasuhan">Kepengasuhan</option></select><label>Isi Catatan</label><textarea id="isi" rows="5" placeholder="Tuliskan catatan perkembangan santri..."></textarea><label>Sifat</label><select id="sifat"><option value="positif">Positif</option><option value="catatan">Catatan</option><option value="perhatian">Perhatian</option></select><label><input id="wali" type="checkbox" checked> Tampilkan kepada wali</label><button id="simpan">Simpan Catatan</button><div id="msg"></div><h2>Catatan Terbaru</h2><div id="list">Memuat...</div>
<script>const sb=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const $=x=>document.getElementById(x);async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return false}const{data:u,error}=await sb.from('users').select('nama,role,aktif').eq('id',session.user.id).single();if(error||!u||!u.aktif||u.role!=='admin_pengasuhan'){await sb.auth.signOut();location.href='index.html';return false}return true}async function loadSantri(){const{data,error}=await sb.from('santri').select('id,nama_lengkap,nis').eq('status','aktif').order('nama_lengkap');if(error){$('msg').textContent=error.message;return}$('santri').innerHTML=(data||[]).map(s=>`<option value="${s.id}">${s.nama_lengkap} — ${s.nis||''}</option>`).join('')}async function loadList(){const{data,error}=await sb.from('catatan_santri').select('id,tanggal,sumber,isi,sifat,tampil_ke_wali,santri(nama_lengkap)').eq('sumber','kepengasuhan').order('tanggal',{ascending:false}).limit(30);if(error){$('list').textContent=error.message;return}if(!data?.length){$('list').textContent='Belum ada catatan.';return}$('list').innerHTML=data.map(c=>`<div class="item"><strong>Catatan Kepengasuhan</strong><br>${c.santri?.nama_lengkap||'-'} · ${c.tanggal||'-'}<br>Oleh: Admin Pengasuhan<br>Sifat: ${c.sifat}<br>${c.isi}<br>Wali: ${c.tampil_ke_wali?'Tampil':'Tidak tampil'}</div>`).join('')}$('simpan').onclick=async()=>{const{data:{user}}=await sb.auth.getUser();const isi=$('isi').value.trim();if(!isi){$('msg').textContent='Isi catatan wajib diisi.';return}const{error}=await sb.from('catatan_santri').insert({santri_id:$('santri').value,tanggal:$('tanggal').value||new Date().toISOString().slice(0,10),sumber:'kepengasuhan',pemberi_id:user.id,isi,sifat:$('sifat').value,tampil_ke_wali:$('wali').checked});if(error){$('msg').textContent='Gagal: '+error.message;return}$('msg').textContent='Catatan berhasil disimpan.';$('isi').value='';loadList()};(async()=>{if(await guard()){await loadSantri();$('tanggal').value=new Date().toISOString().slice(0,10);await loadList()}})();</script></body></html>
