<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Kepengasuhan</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}.top{background:#1f2937;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto}.content{max-width:900px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #0000000b}h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin-top:0}label{display:block;font-weight:600;font-size:14px;margin:15px 0 7px}select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:#fff}textarea{min-height:95px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:12px 16px;border:0;border-radius:9px;background:#1f2937;color:white;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#6b7280}.btn.send{background:#166534}.actions{display:flex;gap:10px;flex-wrap:wrap}.msg{padding:11px;border-radius:9px;margin-bottom:15px;display:none}.ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#b91c1c}.muted{color:#6b7280;font-size:14px}.readonly{opacity:.78}.status-badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:600}@media(max-width:600px){.row{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><header class="top"><div class="wrap"><h1>Laporan Kepengasuhan</h1><div style="color:#d1d5db;font-size:14px">Admin Pengasuhan</div></div></header><main class="content"><div id="msg" class="msg"></div><section class="card"><h2>Pilih Santri & Periode</h2><div class="row"><div><label>Santri</label><select id="santri"><option value="">Memuat santri...</option></select></div><div><label>Periode</label><select id="periode"><option value="">Memuat periode...</option></select></div></div><p id="info" class="muted">Pilih santri dan periode untuk mulai mengisi.</p></section><section id="formCard" class="card"><h2>Perkembangan Kepengasuhan</h2><label>Kedisiplinan</label><select id="kedisiplinan"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Adab & Akhlak</label><select id="adab"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Kemandirian</label><select id="kemandirian"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Kepatuhan terhadap Aturan</label><select id="kepatuhan"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Kehidupan Pondok / Kegiatan</label><select id="kegiatan"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select><label>Perkembangan Pembinaan</label><textarea id="perkembangan_pembinaan" placeholder="Tuliskan perkembangan pembinaan santri..."></textarea><label>Catatan</label><textarea id="catatan" placeholder="Catatan tambahan dari Admin Pengasuhan..."></textarea><div class="actions"><button class="btn" id="save">Simpan Draft</button><button class="btn send" id="send" style="display:none">Kirim Laporan</button><a class="btn secondary" href="admin-pengasuhan.html">Kembali</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const $=id=>document.getElementById(id),msg=$('msg');let sessionUser=null,report=null,care=null;function message(t,ok=false){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}function setEditable(on){['kedisiplinan','adab','kemandirian','kepatuhan','kegiatan','perkembangan_pembinaan','catatan'].forEach(k=>$(k).disabled=!on);$('formCard').classList.toggle('readonly',!on)}function updateButtons(){const status=care?.status||'draft';const editable=!report||status==='draft'||status==='perlu_perbaikan';setEditable(editable);$('send').style.display=(report&&care&&care.id&&editable)?'inline-block':'none';$('save').style.display=editable?'inline-block':'none'}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}sessionUser=session.user;const {data:u,error:ue}=await db.from('users').select('nama,role,aktif').eq('id',session.user.id).single();if(ue||!u||!u.aktif||u.role!=='admin_pengasuhan'){await db.auth.signOut();location.href='index.html';return}const {data:s,error:se}=await db.from('santri').select('id,nis,nama_lengkap').eq('status','aktif').order('nama_lengkap');if(se){message('Gagal memuat data santri: '+se.message);return}$('santri').innerHTML='<option value="">Pilih santri</option>'+s.map(x=>`<option value="${x.id}">${x.nama_lengkap} — ${x.nis}</option>`).join('');const {data:p,error:pe}=await db.from('periode_laporan').select('id,bulan,tahun,semester,status').order('tahun',{ascending:false}).order('bulan',{ascending:false});if(pe){message('Gagal memuat periode: '+pe.message);return}const month=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];$('periode').innerHTML='<option value="">Pilih periode</option>'+p.map(x=>`<option value="${x.id}">${month[x.bulan-1]} ${x.tahun} — Semester ${x.semester}</option>`).join('');$('santri').onchange=loadReport;$('periode').onchange=loadReport;$('save').onclick=saveReport;$('send').onclick=sendReport;$('save').style.display='inline-block';setEditable(false)}
async function loadReport(){report=null;care=null;msg.style.display='none';const sid=$('santri').value,pid=$('periode').value;if(!sid||!pid){$('info').textContent='Pilih santri dan periode untuk mulai mengisi.';setEditable(false);$('save').style.display='inline-block';$('send').style.display='none';return}const {data:lb,error}=await db.from('laporan_bulanan').select('*').eq('santri_id',sid).eq('periode_id',pid).maybeSingle();if(error){message('Gagal memuat laporan: '+error.message);return}if(!lb){report=null;care=null;$('info').textContent='Belum ada laporan utama. Laporan akan dibuat saat Anda menyimpan.';['kedisiplinan','adab','kemandirian','kepatuhan','kegiatan','perkembangan_pembinaan','catatan'].forEach(k=>$(k).value='');setEditable(true);$('send').style.display='none';return}report=lb;const {data:c,error:ce}=await db.from('laporan_kepengasuhan').select('*').eq('laporan_id',lb.id).maybeSingle();if(ce){message('Gagal memuat data kepengasuhan: '+ce.message);return}care=c;if(c){['kedisiplinan','adab','kemandirian','kepatuhan','kegiatan','perkembangan_pembinaan','catatan'].forEach(k=>$(k).value=c[k]||'');$('info').innerHTML='Laporan kepengasuhan sudah ada. Status: <span class="status-badge">'+(c.status||'draft')+'</span>'+(lb.status==='terbit'?' • Laporan utama sudah <b>Terbit</b> dan dikunci.':'')}else{$('info').textContent='Laporan utama sudah ada, bagian Kepengasuhan belum diisi.';['kedisiplinan','adab','kemandirian','kepatuhan','kegiatan','perkembangan_pembinaan','catatan'].forEach(k=>$(k).value='')}updateButtons();if(report.status==='terbit'){setEditable(false);$('save').style.display='none';$('send').style.display='none'}}
async function saveReport(){msg.style.display='none';const sid=$('santri').value,pid=$('periode').value;if(!sid||!pid){message('Pilih santri dan periode terlebih dahulu.');return}if(report?.status==='terbit'){message('Laporan yang sudah Terbit tidak dapat diedit langsung.');return}const btn=$('save');btn.disabled=true;btn.textContent='Menyimpan...';try{if(!report){const {data:sk}=await db.from('santri_kelas').select('kelas_id,kelas(nama)').eq('santri_id',sid).eq('aktif',true).maybeSingle();const {data:sa}=await db.from('santri_asrama').select('asrama_id,asrama(nama)').eq('santri_id',sid).eq('aktif',true).maybeSingle();const r=await db.from('laporan_bulanan').insert({santri_id:sid,periode_id:pid,kelas_snapshot:sk?.kelas?.nama||null,asrama_snapshot:sa?.asrama?.nama||null,status:'draft'}).select().single();if(r.error)throw r.error;report=r.data}const data={laporan_id:report.id,kedisiplinan:$('kedisiplinan').value||null,adab:$('adab').value||null,kemandirian:$('kemandirian').value||null,kepatuhan:$('kepatuhan').value||null,kegiatan:$('kegiatan').value||null,perkembangan_pembinaan:$('perkembangan_pembinaan').value.trim()||null,catatan:$('catatan').value.trim()||null,diisi_oleh:sessionUser.id,status:care?.status==='perlu_perbaikan'?'perlu_perbaikan':'draft'};let r;if(care)r=await db.from('laporan_kepengasuhan').update(data).eq('id',care.id).select().single();else r=await db.from('laporan_kepengasuhan').insert(data).select().single();if(r.error)throw r.error;care=r.data;message('Laporan Kepengasuhan berhasil disimpan sebagai Draft.',true);$('info').textContent='Draft tersimpan. Laporan belum dikirim dan belum terlihat oleh wali.';updateButtons()}catch(e){console.error(e);message('Gagal menyimpan: '+e.message)}finally{btn.disabled=false;btn.textContent='Simpan Draft'}}
async function sendReport(){if(!report||!care?.id){message('Simpan draft terlebih dahulu.');return}if(report.status==='terbit'){message('Laporan yang sudah Terbit tidak dapat dikirim ulang.');return}if(!['draft','perlu_perbaikan'].includes(care.status)){message('Laporan ini tidak berada pada status yang dapat dikirim.');return}if(!confirm('Kirim laporan Kepengasuhan ini? Setelah dikirim, laporan utama siap diperiksa.'))return;const btn=$('send');btn.disabled=true;btn.textContent='Mengirim...';try{const a=await db.from('laporan_kepengasuhan').update({status:'dikirim',updated_at:new Date().toISOString()}).eq('id',care.id).select().single();if(a.error)throw a.error;const r=await db.from('laporan_bulanan').update({status:'dikirim',updated_at:new Date().toISOString()}).eq('id',report.id).select().single();if(r.error)throw r.error;care=a.data;report=r.data;message('Laporan Kepengasuhan berhasil dikirim.',true);$('info').textContent='Laporan sudah dikirim untuk diperiksa. Laporan belum terlihat oleh wali.';updateButtons()}catch(e){console.error(e);message('Gagal mengirim: '+e.message)}finally{btn.disabled=false;btn.textContent='Kirim Laporan'}}init();</script></body></html>
