<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Santri</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;max-width:1100px;margin:25px auto;padding:0 15px}input,select,button{padding:9px;margin:5px 0;width:100%;box-sizing:border-box}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #ddd;padding:12px;margin:8px 0}.msg{padding:10px;background:#f3f4f6}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><a href="admin.html">← Admin Utama</a><h1>Data Santri</h1><div class="grid"><div><label>NIS</label><input id="nis"><label>Nama Lengkap</label><input id="nama"><label>Nama Panggilan</label><input id="panggilan"><label>Jenis Kelamin</label><select id="jk"><option value="putra">Putra</option><option value="putri">Putri</option></select><label>Tempat Lahir</label><input id="tempat"><label>Tanggal Lahir</label><input id="lahir" type="date"></div><div><label>Status</label><select id="status"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select><label>Tanggal Masuk</label><input id="masuk" type="date"><button id="simpan">Tambah Santri</button><div id="msg" class="msg"></div></div></div><h2>Daftar Santri</h2><input id="cari" placeholder="Cari nama atau NIS"><div id="list">Memuat...</div><script>const sb=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const $=x=>document.getElementById(x);async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return false}const{data:u}=await sb.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||u.role!=='admin'){location.href='index.html';return false}return true}async function load(){let q=sb.from('santri').select('*').order('nama_lengkap');const c=$('cari').value.trim();if(c)q=q.or(`nama_lengkap.ilike.%${c}%,nis.ilike.%${c}%`);const{data,error}=await q.limit(100);if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).map(s=>`<div class="item"><b>${s.nama_lengkap}</b> (${s.nis||'-'})<br>Status: ${s.status} · ${s.jenis_kelamin||'-'}<br>${s.tempat_lahir||''} ${s.tanggal_lahir||''}<br><button onclick="editStatus('${s.id}','${s.status}')">Ubah Status</button></div>`).join('')||'Belum ada data.'}async function editStatus(id,status){const n=status==='aktif'?'nonaktif':'aktif';const{error}=await sb.from('santri').update({status:n}).eq('id',id);if(error)alert(error.message);load()}$('simpan').onclick=async()=>{const{data:{user}}=await sb.auth.getUser();const p={nis:$('nis').value.trim()||null,nama_lengkap:$('nama').value.trim(),nama_panggilan:$('panggilan').value.trim()||null,jenis_kelamin:$('jk').value,tempat_lahir:$('tempat').value.trim()||null,tanggal_lahir:$('lahir').value||null,status:$('status').value,tanggal_masuk:$('masuk').value||null};if(!p.nama_lengkap){$('msg').textContent='Nama lengkap wajib diisi.';return}const{error}=await sb.from('santri').insert(p);$('msg').textContent=error?'Gagal: '+error.message:'Santri berhasil ditambahkan.';if(!error){document.querySelectorAll('input').forEach(x=>x.value='');load()}};$('cari').oninput=load;(async()=>{if(await guard())load()})();</script></body></html>
