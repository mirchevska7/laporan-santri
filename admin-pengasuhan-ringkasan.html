<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ringkasan Perkembangan - Laporan Santri</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}.top{background:#1f2937;color:#fff;padding:20px}.wrap,.content{max-width:900px;margin:auto}.top h1{margin:0 0 5px;font-size:24px}.top p{margin:0;color:#d1d5db;font-size:14px}.content{padding:24px 16px}.panel{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #0000000b}.filters{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;background:#fff;font:inherit}textarea{min-height:180px;resize:vertical;line-height:1.55}.status{padding:12px;border-radius:10px;background:#f3f4f6;color:#4b5563;margin-top:14px;font-size:14px}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.info{background:#eff6ff;color:#1d4ed8}.btn{padding:11px 15px;border:0;border-radius:9px;background:#1f2937;color:#fff;cursor:pointer;text-decoration:none;margin-right:8px;font:inherit}.save{background:#15803d}.btn:disabled{opacity:.6;cursor:not-allowed}.hidden{display:none}@media(max-width:650px){.filters{grid-template-columns:1fr}.top h1{font-size:20px}.content{padding-top:16px}}</style></head><body><header class="top"><div class="wrap"><h1>Ringkasan Perkembangan</h1><p>Admin Pengasuhan • Ringkasan akhir laporan bulanan</p></div></header><main class="content"><section class="panel"><div class="filters"><div><label for="santri">Santri</label><select id="santri"><option value="">Pilih santri</option></select></div><div><label for="periode">Periode</label><select id="periode"><option value="">Pilih periode</option></select></div></div><div id="status" class="status">Pilih santri dan periode.</div></section><section id="formPanel" class="panel hidden"><label for="isi">Ringkasan Perkembangan</label><textarea id="isi" placeholder="Tuliskan ringkasan perkembangan santri secara menyeluruh berdasarkan laporan Akademik, Tahfizh, dan Kepengasuhan."></textarea><div id="note" class="status info">Ringkasan ini melengkapi laporan bulanan sebelum diperiksa untuk diterbitkan kepada wali.</div><div style="margin-top:14px"><button id="save" class="btn save">Simpan Ringkasan</button><a class="btn" href="admin-pengasuhan.html">Kembali</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const santriSel=document.getElementById('santri'),periodeSel=document.getElementById('periode'),status=document.getElementById('status'),formPanel=document.getElementById('formPanel'),isi=document.getElementById('isi'),save=document.getElementById('save'),note=document.getElementById('note');let laporanId=null,currentUser=null;const months=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];function setStatus(text,type=''){status.textContent=text;status.className='status '+type}async function init(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}currentUser=session.user;const{data:u}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||!['admin_pengasuhan','admin'].includes(u.role)){await db.auth.signOut();location.href='index.html';return}const{data:s,error:se}=await db.from('santri').select('id,nis,nama_lengkap').eq('status','aktif').order('nama_lengkap');if(se){setStatus('Gagal memuat santri: '+se.message,'error');return}(s||[]).forEach(x=>santriSel.insertAdjacentHTML('beforeend',`<option value="${x.id}">${x.nama_lengkap} — ${x.nis||'-'}</option>`));const{data:p,error:pe}=await db.from('periode_laporan').select('id,bulan,tahun,semester').order('tahun',{ascending:false}).order('bulan',{ascending:false});if(pe){setStatus('Gagal memuat periode: '+pe.message,'error');return}(p||[]).forEach(x=>periodeSel.insertAdjacentHTML('beforeend',`<option value="${x.id}">${months[x.bulan]} ${x.tahun} • Semester ${x.semester}</option>`));santriSel.onchange=load;periodeSel.onchange=load}async function load(){formPanel.classList.add('hidden');laporanId=null;isi.value='';if(!santriSel.value||!periodeSel.value){setStatus('Pilih santri dan periode.');return}setStatus('Memuat laporan...');const{data:r,error}=await db.from('laporan_bulanan').select('id,status').eq('santri_id',santriSel.value).eq('periode_id',periodeSel.value).maybeSingle();if(error){setStatus('Gagal memuat laporan: '+error.message,'error');return}if(!r){setStatus('Belum ada laporan utama untuk santri dan periode ini. Isi laporan bagian terlebih dahulu.','error');return}if(r.status==='terbit'){setStatus('Laporan ini sudah terbit. Ringkasan tidak dapat diubah.','info');return}laporanId=r.id;const{data:ring,error:re}=await db.from('ringkasan_perkembangan').select('isi').eq('laporan_id',laporanId).maybeSingle();if(re){setStatus('Gagal memuat ringkasan: '+re.message,'error');return}if(ring?.isi){isi.value=ring.isi;setStatus('Ringkasan sudah ada. Anda dapat memperbaruinya sebelum laporan diterbitkan.','success')}else setStatus('Laporan ditemukan. Isi ringkasan perkembangan untuk melengkapi laporan.','info');formPanel.classList.remove('hidden')}save.onclick=async()=>{const text=isi.value.trim();if(!laporanId){alert('Pilih santri dan periode terlebih dahulu.');return}if(!text){alert('Ringkasan perkembangan belum diisi.');isi.focus();return}save.disabled=true;save.textContent='Menyimpan...';const{error}=await db.from('ringkasan_perkembangan').upsert({laporan_id:laporanId,isi:text,dibuat_oleh:currentUser.id,updated_at:new Date().toISOString()},{onConflict:'laporan_id'});if(error){note.textContent='Gagal menyimpan: '+error.message;note.className='status error';save.disabled=false;save.textContent='Simpan Ringkasan';return}note.textContent='Ringkasan tersimpan. Sekarang laporan dapat diperiksa kembali dan diterbitkan jika seluruh bagian sudah lengkap.';note.className='status success';save.disabled=false;save.textContent='Simpan Ringkasan';setStatus('Ringkasan perkembangan berhasil disimpan.','success')};init();</script></body></html>
