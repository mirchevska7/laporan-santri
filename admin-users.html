<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Pengguna</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:1000px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin:16px 0}input,select,button{padding:10px;width:100%;box-sizing:border-box;margin:5px 0 10px;border:1px solid #d7dde5;border-radius:9px}button{background:#18212f;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e3e8ef;border-radius:10px;padding:13px;margin:8px 0}.muted{color:#718096;font-size:13px}.ok{color:#067647}.err{color:#b42318}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><h2>🔐 Daftar Pengguna</h2><a href="admin.html">← Admin Utama</a></div><div id="msg" class="muted"></div><section class="card"><h3>Tambah profil pengguna</h3><div class="muted">Akun login Auth dibuat melalui Supabase Auth. Halaman ini hanya mengelola profil pengguna yang sudah memiliki user ID Auth.</div><div class="grid"><input id="uid" placeholder="User ID Auth (UUID)"><input id="nama" placeholder="Nama pengguna"><input id="email" type="email" placeholder="Email"><input id="username" placeholder="Username"></div><select id="role"><option value="admin_akademik">Admin Akademik</option><option value="admin_tahfizh">Admin Tahfizh</option><option value="admin_pengasuhan">Admin Pengasuhan</option><option value="admin_asrama">Admin Asrama</option><option value="wali_santri">Wali Santri</option><option value="admin">Admin Utama</option></select><button id="simpan">Simpan Profil</button></section><section class="card"><h3>Pengguna terdaftar</h3><div id="list">Memuat...</div></section></main><script>const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const $=id=>document.getElementById(id);const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const roleName={admin:'Admin Utama',admin_akademik:'Admin Akademik',admin_tahfizh:'Admin Tahfizh',admin_pengasuhan:'Admin Pengasuhan',admin_asrama:'Admin Asrama',wali_santri:'Wali Santri'};async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return false}const{data:u}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||u.role!=='admin'){location.href='index.html';return false}return true}async function load(){const{data,error}=await db.from('users').select('id,nama,email,username,role,aktif').order('created_at');if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).map(u=>`<div class="item"><b>${esc(u.nama)}</b><br>@${esc(u.username||'-')} · ${esc(roleName[u.role]||u.role)}<br><span class="muted">${esc(u.email)} · ${u.aktif?'Aktif':'Nonaktif'}</span></div>`).join('')||'Belum ada pengguna.'}$('simpan').onclick=async()=>{if(!uid.value.trim()||!nama.value.trim()||!email.value.trim()||!username.value.trim()){msg.textContent='User ID, nama, email, dan username wajib diisi.';msg.className='err';return}const{error}=await db.from('users').insert({id:uid.value.trim(),nama:nama.value.trim(),email:email.value.trim(),username:username.value.trim(),role:role.value,aktif:true});msg.textContent=error?'Gagal: '+error.message:'Profil pengguna berhasil disimpan.';msg.className=error?'err':'ok';if(!error){uid.value='';nama.value='';email.value='';username.value='';load()}};(async()=>{if(await guard())load()})();</script></body></html>
