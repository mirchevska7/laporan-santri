<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pemeriksaan Laporan - Laporan Santri</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}.top{background:#1f2937;color:#fff;padding:20px}.wrap,.content{max-width:1100px;margin:auto}.top h1{margin:0 0 5px;font-size:24px}.top p{margin:0;color:#d1d5db;font-size:14px}.content{padding:24px 16px}.panel,.section{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #0000000b}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;font-size:14px}select{width:100%;padding:11px;margin-top:7px;border:1px solid #d1d5db;border-radius:9px;background:#fff}.section h2{margin:0 0 14px;font-size:19px}.row{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.label{font-weight:bold;color:#4b5563}.value{white-space:pre-wrap;line-height:1.55}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:13px}.success{background:#166534;color:#fff}.warn{background:#92400e;color:#fff}.btn{padding:11px 15px;border:0;border-radius:9px;background:#1f2937;color:#fff;cursor:pointer;text-decoration:none;margin-right:8px}.publish{background:#15803d}.danger{background:#b91c1c}.muted{color:#6b7280}.notice{padding:12px;border-radius:10px;background:#f3f4f6;margin-top:12px}.hidden{display:none}@media(max-width:650px){.filters{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:4px}.top h1{font-size:20px}.content{padding-top:16px}}
</style></head><body><header class="top"><div class="wrap"><h1>Pemeriksaan Laporan</h1><p>Admin Pengasuhan • Pemeriksaan sebelum Terbit</p></div></header><main class="content">
<div class="panel"><div class="filters"><div><label>Santri</label><select id="santri"><option value="">Pilih santri...</option></select></div><div><label>Periode</label><select id="periode"><option value="">Pilih periode...</option></select></div></div><div id="notice" class="notice muted">Pilih santri dan periode untuk memeriksa laporan.</div></div>
<div id="report" class="hidden"><div class="panel"><h2 id="title" style="margin:0 0 10px"></h2><div id="meta" class="muted"></div></div><div id="sections"></div><div class="panel"><h3 style="margin-top:0">Status Laporan</h3><div id="reportStatus"></div><div style="margin-top:14px"><button id="publish" class="btn publish hidden">Terbitkan Laporan</button><a class="btn" href="admin-pengasuhan.html">Kembali</a></div><div id="publishNote" class="notice muted">Laporan hanya akan terlihat oleh wali setelah diterbitkan.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');
const santriSel=document.getElementById('santri'),periodeSel=document.getElementById('periode'),notice=document.getElementById('notice'),report=document.getElementById('report'),sections=document.getElementById('sections'),publish=document.getElementById('publish'),reportStatus=document.getElementById('reportStatus');let current=null;
const months=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const labels={kehadiran:'Kehadiran',keaktifan:'Keaktifan Belajar',kedisiplinan:'Kedisiplinan Belajar',tanggung_jawab:'Tanggung Jawab Tugas',sikap:'Sikap dalam Pembelajaran',perkembangan:'Perkembangan Belajar',catatan:'Catatan',target:'Target',hafalan_baru:'Hafalan Baru',murajaah:'Murajaah',kelancaran:'Kelancaran',mutqin:'Mutqin',konsistensi_setoran:'Konsistensi Setoran',perbaikan_bacaan:'Perbaikan Bacaan',adab:'Adab & Akhlak',kemandirian:'Kemandirian',kepatuhan:'Kepatuhan terhadap Aturan',kegiatan:'Kehidupan Pondok/Kegiatan',perkembangan_pembinaan:'Perkembangan Pembinaan',isi:'Ringkasan Perkembangan'};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(v){return v==null||v===''?'<span class="muted">Belum diisi</span>':esc(v)}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const {data:u}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||!['admin_pengasuhan','admin'].includes(u.role)){await db.auth.signOut();location.href='index.html';return}
let {data:s}=await db.from('santri').select('id,nis,nama_lengkap').eq('status','aktif').order('nama_lengkap');(s||[]).forEach(x=>santriSel.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.nama_lengkap)} — ${esc(x.nis)}</option>`));let {data:p}=await db.from('periode_laporan').select('id,bulan,tahun,semester').order('tahun',{ascending:false}).order('bulan',{ascending:false});(p||[]).forEach(x=>periodeSel.insertAdjacentHTML('beforeend',`<option value="${x.id}">${months[x.bulan]} ${x.tahun} • Semester ${x.semester}</option>`));santriSel.onchange=load;periodeSel.onchange=load}
async function load(){report.classList.add('hidden');publish.classList.add('hidden');if(!santriSel.value||!periodeSel.value){notice.textContent='Pilih santri dan periode untuk memeriksa laporan.';return}notice.textContent='Memuat laporan...';let {data:r,error}=await db.from('laporan_bulanan').select('*').eq('santri_id',santriSel.value).eq('periode_id',periodeSel.value).maybeSingle();if(error){notice.textContent='Gagal memuat laporan: '+error.message;return}if(!r){notice.textContent='Belum ada laporan bulanan untuk santri dan periode ini.';return}current=r;const santriName=santriSel.options[santriSel.selectedIndex].text;document.getElementById('title').textContent='Laporan Bulanan — '+santriName;document.getElementById('meta').textContent='Kelas: '+(r.kelas_snapshot||'-')+' • Asrama: '+(r.asrama_snapshot||'-');reportStatus.innerHTML=`<span class="badge ${r.status==='terbit'?'success':r.status==='dikirim'?'warn':''}">${esc(r.status)}</span>`;notice.textContent='Laporan ditemukan.';sections.innerHTML='';
await section('📚 Akademik','laporan_akademik');await section('📖 Tahfizh','laporan_tahfizh');await section('🏡 Kepengasuhan','laporan_kepengasuhan');await section('🧭 Ringkasan Perkembangan','ringkasan_perkembangan');report.classList.remove('hidden');if(['dikirim','perlu_perbaikan'].includes(r.status)){publish.classList.remove('hidden');document.getElementById('publishNote').textContent='Pastikan bagian yang diperlukan sudah terisi dan sudah diperiksa sebelum menerbitkan.'}else if(r.status==='terbit'){document.getElementById('publishNote').textContent='Laporan ini sudah terbit. Untuk perubahan, gunakan alur Ajukan Perubahan agar riwayat tetap terjaga.'}}
async function section(title,table){let {data,error}=await db.from(table).select('*').eq('laporan_id',current.id).maybeSingle();let box=document.createElement('div');box.className='section';if(error){box.innerHTML=`<h2>${title}</h2><div class="muted">Gagal memuat bagian: ${esc(error.message)}</div>`;sections.appendChild(box);return}box.innerHTML='<h2>'+title+'</h2>';if(!data){box.innerHTML+='<div class="muted">Bagian ini belum diisi.</div>';sections.appendChild(box);return}Object.entries(data).forEach(([k,v])=>{if(['id','laporan_id','created_at','updated_at','diisi_oleh','dibuat_oleh','status'].includes(k)||v==null||v==='')return;box.innerHTML+=`<div class="row"><div class="label">${labels[k]||k}</div><div class="value">${fmt(v)}</div></div>`});sections.appendChild(box)}
publish.onclick=async()=>{if(!current)return;if(!confirm('Terbitkan laporan ini? Setelah diterbitkan, laporan dapat dilihat oleh wali santri.'))return;publish.disabled=true;publish.textContent='Menerbitkan...';const {data:{user}}=await db.auth.getUser();let {error}=await db.from('laporan_bulanan').update({status:'terbit',diterbitkan_pada:new Date().toISOString(),diterbitkan_oleh:user.id,updated_at:new Date().toISOString()}).eq('id',current.id);if(error){alert('Gagal menerbitkan: '+error.message);publish.disabled=false;publish.textContent='Terbitkan Laporan';return}current.status='terbit';reportStatus.innerHTML='<span class="badge success">terbit</span>';publish.classList.add('hidden');document.getElementById('publishNote').textContent='Laporan berhasil diterbitkan dan sekarang dapat dilihat oleh wali santri.';notice.textContent='Berhasil menerbitkan laporan.'};init();
</script></body></html>
