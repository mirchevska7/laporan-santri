e).order('tanggal',{ascending:false});if(re){document.getElementById('content').textContent='Catatan belum dapat dimuat: '+re.message;return}document.getElementById('content').innerHTML=rows?.length?rows.map(r=>`<article class="card"><strong>${esc(r.tanggal||'-')}</strong><div class="muted">Sumber: ${esc(r.sumber||'-')}</div><p>${esc(r.isi||'-')}</p><span class="tag">${esc(r.sifat||'catatan')}</span></article>`).join(''):'Belum ada catatan yang ditampilkan kepada wali.'}run();</script></body></html>
