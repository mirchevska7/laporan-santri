<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Laporan Tahfizh - Laporan Santri</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}.top{background:#1f2937;color:#fff;padding:20px}.wrap{max-width:1000px;margin:auto}.top h1{margin:0 0 5px;font-size:23px}.top p{margin:0;color:#d1d5db;font-size:14px}.content{max-width:1000px;margin:22px auto;padding:0 16px}.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #0000000b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:14px;background:#fff}textarea{min-height:100px;resize:vertical}.field{margin-bottom:15px}.hint{font-size:13px;color:#6b7280;margin-top:5px}.status{padding:11px;border-radius:9px;background:#f3f4f6;font-size:14px;margin-top:12px}.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#991b1b}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:12px 16px;background:#1f2937;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#6b7280}.btn:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e5e7eb;font-size:12px;margin-left:5px}@media(max-width:600px){.top h1{font-size:20px}.card{padding:16px}}</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>Laporan Tahfizh</h1><p>Admin Tahfizh</p></div></header>
<main class="content">
<div class="card"><div class="grid">
<div class="field"><label for="santri">Santri</label><select id="santri"><option value="">Memuat santri...</option></select></div>
<div class="field"><label for="periode">Periode</label><select id="periode"><option value="">Memuat periode...</option></select></div>
</div><div id="info" class="status">Pilih santri dan periode.</div></div>
<div class="actions" style="margin:0 0 18px"><a href="admin-tahfizh.html" class="btn secondary">Kembali</a></div>
<form id="form" class="card hidden">
<div class="grid">
<div class="field"><label>Target</label><textarea id="target" placeholder="Contoh: Target 2 halaman"></textarea></div>
<div class="field"><label>Hafalan Baru</label><textarea id="hafalan_baru" placeholder="Contoh: 1 halaman"></textarea></div>
<div class="field"><label>Murajaah</label><select id="murajaah"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select></div>
<div class="field"><label>Kelancaran</label><select id="kelancaran"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select></div>
<div class="field"><label>Mutqin</label><select id="mutqin"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select></div>
<div class="field"><label>Konsistensi Setoran</label><select id="konsistensi_setoran"><option value="">Pilih</option><option>Sangat Baik</option><option>Baik</option><option>Cukup</option><option>Perlu Perhatian</option></select></div>
</div>
<div id="perbaikanWrap" class="field hidden"><label>Perbaikan Bacaan</label><textarea id="perbaikan_bacaan" placeholder="Catatan perbaikan bacaan"></textarea><div class="hint">Ditampilkan untuk Kelas 1 KMI / Kelas 1 TKS.</div></div>
<div class="field"><label>Catatan</label><textarea id="catatan" placeholder="Catatan perkembangan Tahfizh"></textarea></div>
<div id="formStatus" class="status hidden"></div>
<div class="actions"><button type="button" class="btn" id="save">Simpan Draft</button><button type="button" class="btn" id="send">Kirim Laporan</button><a href="admin-tahfizh.html" class="btn secondary">Kembali</a></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');let sessionUser=null,currentMain=null,currentDetail=null,currentClass='';const $=id=>document.getElementById(id),pred=['murajaah','kelancaran','mutqin','konsistensi_setoran'];
function msg(text,type=''){const e=$('formStatus');e.textContent=text;e.className='status '+(type||'');e.classList.remove('hidden')}
function mainStatusLabel(s){return{draft:'Draft',dikirim:'Dikirim',perlu_perbaikan:'Perlu Perbaikan',terbit:'Terbit'}[s]||s||'-'}
function formatPeriode(p){const names=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];return`${names[Number(p.bulan)]||p.bulan} ${p.tahun} — Semester ${p.semester}`}
async function init(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}sessionUser=session.user;const{data:u,error:ue}=await db.from('users').select('nama,role,aktif').eq('id',session.user.id).single();if(ue||!u||!u.aktif||u.role!=='admin_tahfizh'){await db.auth.signOut();location.href='index.html';return}const{data:santri,error:se}=await db.from('santri').select('id,nis,nama_lengkap,status').eq('status','aktif').order('nama_lengkap');if(se){$('info').textContent='Gagal memuat santri: '+se.message;return}$('santri').innerHTML='<option value="">Pilih santri</option>'+(santri||[]).map(s=>`<option value="${s.id}">${s.nama_lengkap} — ${s.nis||''}</option>`).join('');const{data:periode,error:pe}=await db.from('periode_laporan').select('id,bulan,tahun,semester,tahun_ajaran_id').order('tahun').order('bulan');if(pe){$('info').textContent='Gagal memuat periode: '+pe.message;return}$('periode').innerHTML='<option value="">Pilih periode</option>'+(periode||[]).map(p=>`<option value="${p.id}">${formatPeriode(p)}</option>`).join('');$('santri').onchange=load;$('periode').onchange=load;$('save').onclick=()=>save(false);$('send').onclick=()=>save(true)}
async function load(){const sid=$('santri').value,pid=$('periode').value;if(!sid||!pid){$('form').classList.add('hidden');$('info').textContent='Pilih santri dan periode.';return}msg('');$('form').classList.add('hidden');const{data:sk}=await db.from('santri_kelas').select('kelas_id,kelas:kelas_id(nama)').eq('santri_id',sid).eq('aktif',true).maybeSingle();currentClass=sk?.kelas?.nama||'';$('perbaikanWrap').classList.toggle('hidden',!(currentClass==='Kelas 1 KMI'||currentClass==='Kelas 1 TKS'));let{data:main,error:me}=await db.from('laporan_bulanan').select('*').eq('santri_id',sid).eq('periode_id',pid).maybeSingle();if(me){$('info').textContent='Gagal memuat laporan: '+me.message;return}currentMain=main||null;currentDetail=null;if(main){const{data:d,error:de}=await db.from('laporan_tahfizh').select('*').eq('laporan_id',main.id).maybeSingle();if(de){$('info').textContent='Gagal memuat detail: '+de.message;return}currentDetail=d}fill();$('form').classList.remove('hidden');$('info').innerHTML=`Status laporan utama: <b>${mainStatusLabel(currentMain?.status||'draft')}</b>`+(currentClass?` <span class="badge">${currentClass}</span>`:'');const detailLocked=currentDetail?.status==='dikirim'||currentDetail?.status==='selesai';const mainLocked=currentMain?.status==='terbit';setLocked(detailLocked,mainLocked)}
function fill(){const d=currentDetail||{};$('target').value=d.target||'';$('hafalan_baru').value=d.hafalan_baru||'';pred.forEach(x=>$(x).value=d[x]||'');$('perbaikan_bacaan').value=d.perbaikan_bacaan||'';$('catatan').value=d.catatan||''}
function setLocked(detailLocked,mainLocked){['target','hafalan_baru','murajaah','kelancaran','mutqin','konsistensi_setoran','perbaikan_bacaan','catatan'].forEach(x=>$(x).disabled=detailLocked||mainLocked);$('save').disabled=detailLocked||mainLocked;$('send').disabled=mainLocked||currentMain?.status!=='draft';if(mainLocked)msg('Laporan sudah terbit dan dikunci.');else if(detailLocked&&currentMain?.status==='draft')msg('Detail Tahfizh sudah dikirim. Silakan klik Kirim Laporan untuk mengirim laporan utama.');else if(currentMain?.status==='dikirim')msg('Laporan sudah dikirim dan menunggu pemeriksaan.')}
async function ensureMain(){if(currentMain)return true;const sid=$('santri').value,pid=$('periode').value;const{data:kelas}=await db.from('santri_kelas').select('kelas:kelas_id(nama)').eq('santri_id',sid).eq('aktif',true).maybeSingle();const{data:asrama}=await db.from('santri_asrama').select('asrama:asrama_id(nama)').eq('santri_id',sid).eq('aktif',true).maybeSingle();const{data:m,error}=await db.from('laporan_bulanan').insert({santri_id:sid,periode_id:pid,kelas_snapshot:kelas?.kelas?.nama||null,asrama_snapshot:asrama?.asrama?.nama||null,status:'draft'}).select('*').single();if(error){msg('Gagal membuat laporan utama: '+error.message,'err');return false}currentMain=m;return true}
function values(){return{target:$('target').value.trim()||null,hafalan_baru:$('hafalan_baru').value.trim()||null,murajaah:$('murajaah').value||null,kelancaran:$('kelancaran').value||null,mutqin:$('mutqin').value||null,konsistensi_setoran:$('konsistensi_setoran').value||null,perbaikan_bacaan:$('perbaikanWrap').classList.contains('hidden')?null:($('perbaikan_bacaan').value.trim()||null),catatan:$('catatan').value.trim()||null,diisi_oleh:sessionUser.id,status:'draft'}}
async function save(send){msg('Menyimpan...');if(!(await ensureMain()))return;if(send&&currentDetail&&(currentDetail.status==='dikirim'||currentDetail.status==='selesai')){const{data:m,error:me}=await db.from('laporan_bulanan').update({status:'dikirim',updated_at:new Date().toISOString()}).eq('id',currentMain.id).select('*').single();if(me){msg('Status laporan utama gagal dikirim: '+me.message,'err');return}currentMain=m;$('info').innerHTML=`Status laporan utama: <b>${mainStatusLabel(currentMain.status)}</b>`+(currentClass?` <span class="badge">${currentClass}</span>`:'');msg('Laporan Tahfizh berhasil dikirim.','ok');setLocked(true,false);return}const payload=values();if(currentDetail){const{data:d,error}=await db.from('laporan_tahfizh').update({...payload,status:send?'dikirim':'draft',updated_at:new Date().toISOString()}).eq('id',currentDetail.id).select('*').single();if(error){msg('Gagal menyimpan: '+error.message,'err');return}currentDetail=d}else{const{data:d,error}=await db.from('laporan_tahfizh').insert({...payload,laporan_id:currentMain.id,status:send?'dikirim':'draft'}).select('*').single();if(error){msg('Gagal menyimpan: '+error.message,'err');return}currentDetail=d}if(send){const{data:m,error:me}=await db.from('laporan_bulanan').update({status:'dikirim',updated_at:new Date().toISOString()}).eq('id',currentMain.id).select('*').single();if(me){msg('Detail tersimpan, tetapi status laporan utama gagal dikirim: '+me.message,'err');return}currentMain=m;msg('Laporan Tahfizh berhasil dikirim.','ok')}else msg('Draft Laporan Tahfizh berhasil disimpan.','ok');$('info').innerHTML=`Status laporan utama: <b>${mainStatusLabel(currentMain.status)}</b>`+(currentClass?` <span class="badge">${currentClass}</span>`:'');if(send)setLocked(true,false)}init();
</script>
</body></html>
