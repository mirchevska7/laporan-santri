<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahun Ajaran & Periode</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;max-width:1000px;margin:25px auto;padding:0 15px}input,select,button{padding:9px;width:100%;box-sizing:border-box;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #ddd;padding:12px;margin:8px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><a href="admin.html">← Admin Utama</a><h1>Tahun Ajaran & Periode</h1><h2>Tambah Tahun Ajaran</h2><div class="grid"><input id="nama" placeholder="Contoh 2027/2028"><input id="mulai" type="date"><input id="selesai" type="date"></div><button id="tambahTA">Tambah Tahun Ajaran</button><div id="msg"></div><h2>Tahun Ajaran</h2><div id="ta">Memuat...</div><h2>Periode Laporan</h2><div id="periode">Memuat...</div><script>const sb=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');const $=x=>document.getElementById(x);async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return false}const{data:u}=await sb.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||u.role!=='admin'){location.href='index.html';return false}return true}async function load(){const{data,error}=await sb.from('tahun_ajaran').select('*').order('tanggal_mulai',{ascending:false});if(error){$('ta').textContent=error.message;return}$('ta').innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.nama}</b><br>${x.tanggal_mulai} s/d ${x.tanggal_selesai}<br>${x.aktif?'Aktif':'Tidak aktif'}</div>`).join('')||'Belum ada.';const{data:p,error:e}=await sb.from('periode_laporan').select('*,tahun_ajaran(nama)').order('tahun').order('bulan');if(e){$('periode').textContent=e.message;return}const bulan=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];$('periode').innerHTML=(p||[]).map(x=>`<div class="item"><b>${bulan[x.bulan]} ${x.tahun}</b> · Semester ${x.semester}<br>Tahun Ajaran: ${x.tahun_ajaran?.nama||'-'} · ${x.status}</div>`).join('')||'Belum ada periode.'}$('tambahTA').onclick=async()=>{if(!$('nama').value.trim()||!$('mulai').value||!$('selesai').value){$('msg').textContent='Nama dan tanggal wajib diisi.';return}const{error}=await sb.from('tahun_ajaran').insert({nama:$('nama').value.trim(),tanggal_mulai:$('mulai').value,tanggal_selesai:$('selesai').value,aktif:true});$('msg').textContent=error?'Gagal: '+error.message:'Tahun ajaran berhasil ditambahkan.';if(!error){$('nama').value='';$('mulai').value='';$('selesai').value='';load()}};(async()=>{if(await guard())load()})();</script></body></html>
