<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembinaan Santri</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;max-width:950px;margin:30px auto;padding:0 16px;background:#f6f7f8;color:#222}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:bold;margin:12px 0 6px}select,input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}textarea{min-height:90px}button{padding:10px 16px;border:0;border-radius:8px;background:#222;color:white;margin:14px 8px 0 0;cursor:pointer}.secondary{background:#ddd;color:#222}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.item{border-top:1px solid #eee;padding:14px 0}.muted{color:#666;font-size:13px}.msg{margin-top:14px;padding:10px;border-radius:8px;background:#eef6ee}.error{background:#fdecec}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="card"><h1>Pembinaan Santri</h1><p class="muted">Mencatat proses pembinaan, tindakan, tindak lanjut, dan status penyelesaian.</p><div id="identity" class="muted">Memuat...</div></div><div class="card"><h2>Tambah Pembinaan</h2><div class="row"><div><label>Santri</label><select id="santri"><option value="">Memuat...</option></select></div><div><label>Tanggal</label><input id="tanggal" type="date"></div></div><label>Jenis Pembinaan</label><input id="jenis" placeholder="Contoh: Kedisiplinan, Adab, Kemandirian"><label>Uraian</label><textarea id="uraian" placeholder="Jelaskan kondisi atau hal yang perlu dibina."></textarea><label>Tindakan</label><textarea id="tindakan" placeholder="Tindakan yang dilakukan."></textarea><label>Tindak Lanjut</label><textarea id="lanjut" placeholder="Rencana tindak lanjut."></textarea><div class="row"><div><label>Status</label><select id="status"><option value="dalam_proses">Dalam Proses</option><option value="selesai">Selesai</option></select></div><div><label class="check"><input id="wali" type="checkbox"> Tampilkan kepada Wali Santri</label></div></div><button id="save">Simpan Pembinaan</button><button class="secondary" onclick="location.href='admin-pengasuhan.html'">Kembali</button><div id="msg"></div></div><div class="card"><h2>Riwayat Pembinaan Terbaru</h2><div id="list">Memuat...</div></div><script>const db=window.supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');let uid=null;const $=x=>document.getElementById(x);function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));}function msg(t,e=false){$('msg').textContent=t;$('msg').className=e?'msg error':'msg';}async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return false}uid=session.user.id;const {data:u,error}=await db.from('users').select('nama,role,aktif').eq('id',uid).single();if(error||!u?.aktif||u.role!=='admin_pengasuhan'){document.body.innerHTML='<div class="card"><h2>Akses ditolak</h2><p>Halaman ini khusus Admin Pengasuhan.</p></div>';return false}$('identity').textContent='Masuk sebagai: '+u.nama+' • Admin Pengasuhan';return true}async function santri(){const {data,error}=await db.from('santri').select('id,nama_lengkap,nis').eq('status','aktif').order('nama_lengkap');if(error){$('santri').innerHTML='<option>Gagal memuat</option>';return}$('santri').innerHTML='<option value="">Pilih santri</option>'+(data||[]).map(s=>`<option value="${s.id}">${esc(s.nama_lengkap)}${s.nis?' — '+esc(s.nis):''}</option>`).join('')}async function list(){const {data,error}=await db.from('pembinaan').select('id,santri_id,tanggal,jenis,uraian,tindakan,tindak_lanjut,status,tampil_ke_wali').order('tanggal',{ascending:false}).limit(30);if(error){$('list').textContent='Gagal memuat riwayat.';return}if(!data?.length){$('list').textContent='Belum ada pembinaan.';return}const ids=[...new Set(data.map(x=>x.santri_id))];const {data:s}=await db.from('santri').select('id,nama_lengkap').in('id',ids);const n=Object.fromEntries((s||[]).map(x=>[x.id,x.nama_lengkap]));$('list').innerHTML=data.map(x=>`<div class="item"><b>${esc(n[x.santri_id]||'Santri')}</b><div class="muted">${x.tanggal} • ${esc(x.jenis)} • ${x.status==='selesai'?'Selesai':'Dalam Proses'} • ${x.tampil_ke_wali?'Tampil ke wali':'Tidak tampil ke wali'}</div><div><b>Uraian:</b> ${esc(x.uraian)}</div>${x.tindakan?`<div><b>Tindakan:</b> ${esc(x.tindakan)}</div>`:''}${x.tindak_lanjut?`<div><b>Tindak lanjut:</b> ${esc(x.tindak_lanjut)}</div>`:''}</div>`).join('')}$('save').onclick=async()=>{const sid=$('santri').value,j=$('jenis').value.trim(),u=$('uraian').value.trim();if(!sid||!j||!u){msg('Santri, jenis, dan uraian wajib diisi.',true);return}$('save').disabled=true;msg('Menyimpan...');const {error}=await db.from('pembinaan').insert({santri_id:sid,tanggal:$('tanggal').value||new Date().toISOString().slice(0,10),jenis:j,uraian:u,tindakan:$('tindakan').value.trim()||null,tindak_lanjut:$('lanjut').value.trim()||null,status:$('status').value,tampil_ke_wali:$('wali').checked,created_by:uid});$('save').disabled=false;if(error){msg('Gagal menyimpan: '+error.message,true);return}msg('Pembinaan berhasil disimpan.');$('jenis').value='';$('uraian').value='';$('tindakan').value='';$('lanjut').value='';$('status').value='dalam_proses';$('wali').checked=false;await list()};(async()=>{if(await guard()){$('tanggal').value=new Date().toISOString().slice(0,10);await santri();await list()}})();</script></body></html>
