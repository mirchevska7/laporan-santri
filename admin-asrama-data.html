<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Asrama</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;max-width:900px;margin:25px auto;padding:0 15px}input,textarea,button{padding:9px;width:100%;box-sizing:border-box;margin:5px 0}.item{border:1px solid #ddd;padding:12px;margin:8px 0}</style></head><body><a href="admin.html">← Admin Utama</a><h1>Data Asrama</h1><input id="nama" placeholder="Nama asrama"><textarea id="ket" placeholder="Keterangan"></textarea><button id="simpan">Tambah Asrama</button><div id="msg"></div><h2>Daftar Asrama</h2><div id="list">Memuat...</div><script>const sb=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return false}const{data:u}=await sb.from('users').select('role,aktif').eq('id',session.user.id).single();if(!u||!u.aktif||u.role!=='admin'){location.href='index.html';return false}return true}async function load(){const{data,error}=await sb.from('asrama').select('*').order('nama_asrama');if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.nama_asrama}</b><br>${x.keterangan||''}<br>${x.aktif===false?'Nonaktif':'Aktif'}</div>`).join('')||'Belum ada asrama.'}simpan.onclick=async()=>{if(!nama.value.trim()){msg.textContent='Nama asrama wajib diisi.';return}const{error}=await sb.from('asrama').insert({nama_asrama:nama.value.trim(),keterangan:ket.value.trim()||null});msg.textContent=error?'Gagal: '+error.message:'Asrama berhasil ditambahkan.';if(!error){nama.value='';ket.value='';load()}};(async()=>{if(await guard())load()})();</script></body></html>
