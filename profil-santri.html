<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil Santri - Laporan Santri</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#18212f}.wrap{max-width:820px;margin:auto;padding:28px 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}h2{margin:0;font-size:28px}.back{padding:10px 14px;border:1px solid #dfe4ea;border-radius:10px;background:#fff;color:#18212f;text-decoration:none;white-space:nowrap}.subtitle{color:#718096;margin:-12px 0 24px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px rgba(20,35,55,.04)}h3{margin:0 0 16px;font-size:18px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:13px 0;border-bottom:1px solid #eef0f3}.row:last-child{border-bottom:0}.label{color:#718096;font-size:14px}.value{text-align:right;font-weight:600;word-break:break-word}.status{display:inline-block;padding:6px 10px;border-radius:9px;background:#f0f2f5;font-size:12px}.empty{text-align:center;color:#718096;padding:18px}.error{background:#fff0f0;color:#b42318}@media(max-width:600px){.wrap{padding:20px 14px 40px}h2{font-size:23px}.card{padding:18px}.row{flex-direction:column;gap:5px}.value{text-align:left}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h2>👤 Profil Santri</h2><a class="back" href="wali.html">← Kembali</a></div>
<p class="subtitle">Informasi identitas dan data pendidikan santri yang terhubung dengan akun wali.</p>
<div id="content"><div class="card empty">Memuat data santri...</div></div>
</main>
<script>
const db=supabase.createClient('https://zcnpyqxsdpnunbeuyvxu.supabase.co','sb_publishable_kxhfCkYxoo7V8-SNu-u6IA_ocVOf4S4');
const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const genderMap={laki_laki:'Laki-laki',perempuan:'Perempuan'};
async function run(){
 const box=document.getElementById('content');
 const {data:{session}}=await db.auth.getSession();
 if(!session){location.href='index.html';return}
 const {data:user,error:ue}=await db.from('users').select('role,aktif').eq('id',session.user.id).single();
 if(ue||!user||user.role!=='wali_santri'||!user.aktif){location.href='index.html';return}
 const santriId=new URLSearchParams(location.search).get('santri_id');
 if(!santriId){box.innerHTML='<div class="card empty">Santri belum dipilih.</div>';return}
 const {data:link,error:le}=await db.from('santri_wali').select('hubungan').eq('user_id',session.user.id).eq('santri_id',santriId).eq('aktif',true).maybeSingle();
 if(le||!link){box.innerHTML='<div class="card empty error">Anda tidak memiliki akses ke profil santri ini.</div>';return}
 const {data:s,error:se}=await db.from('santri').select('nis,nama_lengkap,nama_panggilan,jenis_kelamin,tempat_lahir,tanggal_lahir,status,tanggal_masuk').eq('id',santriId).single();
 if(se||!s){box.innerHTML='<div class="card empty error">Data profil santri belum dapat dimuat.</div>';return}
 const {data:placement,error:pe}=await db.rpc('get_wali_santri_current_placement',{p_santri_id:santriId});
 const fmtDate=v=>v?new Date(v+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
 const relationMap={ayah:'Ayah',ibu:'Ibu',wali:'Wali',orang_tua:'Orang Tua'};
 const kelasNama=placement?.kelas||'-';
 const asramaNama=placement?.asrama||'-';
 box.innerHTML=`<section class="card"><h3>Identitas Santri</h3>
 <div class="row"><span class="label">Nama Lengkap</span><strong class="value">${esc(s.nama_lengkap)}</strong></div>
 <div class="row"><span class="label">Nama Panggilan</span><strong class="value">${esc(s.nama_panggilan)}</strong></div>
 <div class="row"><span class="label">NIS</span><strong class="value">${esc(s.nis)}</strong></div>
 <div class="row"><span class="label">Jenis Kelamin</span><strong class="value">${esc(genderMap[s.jenis_kelamin]||s.jenis_kelamin)}</strong></div>
 <div class="row"><span class="label">Tempat Lahir</span><strong class="value">${esc(s.tempat_lahir)}</strong></div>
 <div class="row"><span class="label">Tanggal Lahir</span><strong class="value">${esc(fmtDate(s.tanggal_lahir))}</strong></div>
 <div class="row"><span class="label">Tanggal Masuk</span><strong class="value">${esc(fmtDate(s.tanggal_masuk))}</strong></div>
 <div class="row"><span class="label">Status</span><strong class="value"><span class="status">${esc(s.status||'aktif')}</span></strong></div>
 </section>
 <section class="card"><h3>🏫 Pendidikan & Asrama</h3>
 <div class="row"><span class="label">Kelas Saat Ini</span><strong class="value">${esc(pe?'Belum dapat dimuat':kelasNama)}</strong></div>
 <div class="row"><span class="label">Asrama Saat Ini</span><strong class="value">${esc(pe?'Belum dapat dimuat':asramaNama)}</strong></div>
 </section>
 <section class="card"><h3>Hubungan dengan Wali</h3><div class="row"><span class="label">Hubungan</span><strong class="value">${esc(relationMap[link.hubungan]||link.hubungan||'Wali')}</strong></div></section>`;
}
run();
</script>
</body>
</html>
